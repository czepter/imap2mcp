services:
  imap2mcp:
    image: ghcr.io/czepter/imap2mcp:${IMAP2MCP_TAG:-latest}
    environment:
      SERVICE_FQDN_IMAP2MCP_3000: ""
      BASE_URL: ${SERVICE_URL_IMAP2MCP}
      PORT: "3000"
      SESSION_SECRET: ${SERVICE_PASSWORD_64_SESSION}
      ENCRYPTION_KEY: ${SERVICE_HEX_64_ENCRYPTION}
      REGISTRATION_MODE: ${REGISTRATION_MODE:-dynamic}
      ALLOW_PRIVATE_HOSTS: ${ALLOW_PRIVATE_HOSTS:-}
      ADMIN_BOOTSTRAP_TOKEN: ${SERVICE_PASSWORD_64_BOOTSTRAP}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AUDIT_FAIL_MODE: ${AUDIT_FAIL_MODE:-closed}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-90}
    volumes:
      - imap2mcp-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  imap2mcp-data:
