# Container image: multi-arch (linux/amd64 + linux/arm64), built natively per architecture (no QEMU),
# merged into one manifest list. Independent of ci.yml: it never runs the unit/integration suite.
name: image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - Dockerfile
      - .dockerignore
      - package*.json
      - tsconfig.json
      - drizzle.config.ts
      - drizzle/**
      - src/**
      - sidecar/**
      - scripts/smoke.sh
      - test/smoke/**
      - .github/workflows/image.yml
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - package*.json
      - src/**
      - sidecar/**
      - test/smoke/**
      - .github/workflows/image.yml
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux/amd64, runner: ubuntu-24.04 }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm }
    outputs:
      push: ${{ steps.mode.outputs.push }}
    steps:
      - uses: actions/checkout@v4
      - id: mode
        run: echo "push=${{ github.event_name != 'pull_request' && 'true' || 'false' }}" >> "$GITHUB_OUTPUT"
      - id: slug
        run: echo "pair=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"
        env: { PLATFORM: "${{ matrix.platform }}" }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: steps.mode.outputs.push == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
      # Push-by-digest on main/tags; PRs only build (and load for the smoke test on amd64).
      - name: build and push by digest
        id: build
        if: steps.mode.outputs.push == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ steps.slug.outputs.pair }}
          cache-to: type=gha,scope=${{ steps.slug.outputs.pair }},mode=max
      - name: build (PR, not pushed)
        if: steps.mode.outputs.push != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: imap2mcp:smoke
          cache-from: type=gha,scope=${{ steps.slug.outputs.pair }}
          cache-to: type=gha,scope=${{ steps.slug.outputs.pair }},mode=max
      - name: export digest
        if: steps.mode.outputs.push == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        if: steps.mode.outputs.push == 'true'
        with:
          name: digests-${{ steps.slug.outputs.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
      # Deployment smoke test against the image just built, natively on each architecture.
      - uses: actions/setup-node@v4
        if: steps.mode.outputs.push != 'true'
        with: { node-version: "26", cache: npm }
      - name: smoke test (${{ matrix.platform }})
        if: steps.mode.outputs.push != 'true'
        run: |
          npm ci --ignore-scripts=false
          SMOKE_IMAGE=imap2mcp:smoke npm run smoke

  merge:
    name: publish manifest
    needs: build
    if: needs.build.outputs.push == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
      - name: create manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)
      - name: inspect
        run: docker buildx imagetools inspect ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
