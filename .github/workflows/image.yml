# Container image: multi-arch (linux/amd64 + linux/arm64), built natively per architecture (no QEMU),
# merged into one manifest list. Independent of ci.yml: it never runs the unit/integration suite.
name: image

on:
  # Manual only. Run it from the Actions tab or: gh workflow run image.yml [-f push=false] [-f tag=1.2.3]
  workflow_dispatch:
    inputs:
      push:
        description: "Push to GHCR (false = build + smoke test only, nothing published)"
        type: boolean
        default: true
      tag:
        description: "Extra image tag, e.g. 1.2.3 (optional; edge and sha tags are always set)"
        type: string
        required: false

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux/amd64, runner: ubuntu-24.04 }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm }
    outputs:
      push: ${{ steps.mode.outputs.push }}
    steps:
      - uses: actions/checkout@v7
      - id: mode
        run: echo "push=${{ inputs.push }}" >> "$GITHUB_OUTPUT"
      - id: slug
        run: echo "pair=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"
        env: { PLATFORM: "${{ matrix.platform }}" }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: steps.mode.outputs.push == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
      # Push-by-digest on main/tags; push=false only builds (and loads for the smoke test).
      - name: build and push by digest
        id: build
        if: steps.mode.outputs.push == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ steps.slug.outputs.pair }}
          cache-to: type=gha,scope=${{ steps.slug.outputs.pair }},mode=max
      - name: build (push=false, not published)
        if: steps.mode.outputs.push != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: imap2mcp:smoke
          cache-from: type=gha,scope=${{ steps.slug.outputs.pair }}
          cache-to: type=gha,scope=${{ steps.slug.outputs.pair }},mode=max
      - name: export digest
        if: steps.mode.outputs.push == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        if: steps.mode.outputs.push == 'true'
        with:
          name: digests-${{ steps.slug.outputs.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
      # Deployment smoke test against the image just built, natively on each architecture.
      - uses: actions/setup-node@v4
        if: steps.mode.outputs.push != 'true'
        with: { node-version: "26", cache: npm }
      - name: smoke test (${{ matrix.platform }})
        if: steps.mode.outputs.push != 'true'
        run: |
          npm ci --ignore-scripts=false
          SMOKE_IMAGE=imap2mcp:smoke npm run smoke

  merge:
    name: publish manifest
    needs: build
    if: needs.build.outputs.push == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=edge,branch=main
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=sha,format=short
      - name: create manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)
      - name: inspect
        run: docker buildx imagetools inspect ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
